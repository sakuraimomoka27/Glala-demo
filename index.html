<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>格拉拉的探求手记</title>
<link rel="stylesheet" href="frontend/styles/battle.css?v=field1"><link rel="stylesheet" href="frontend/styles/tools.css?v=field1"><link rel="stylesheet" href="frontend/styles/menus.css?v=field1"><link rel="stylesheet" href="frontend/styles/camp.css?v=field1"><link rel="stylesheet" href="frontend/styles/world.css?v=field1"><link rel="stylesheet" href="frontend/styles/arsenal.css?v=field1"><link rel="stylesheet" href="frontend/styles/game-frame.css?v=field1"><link rel="stylesheet" href="frontend/styles/atlas-map.css?v=field1"><link rel="stylesheet" href="frontend/styles/expedition-report.css?v=field1"><link rel="stylesheet" href="frontend/styles/shared-stash.css?v=field1"><link rel="stylesheet" href="frontend/styles/presentation.css"><link rel="stylesheet" href="frontend/styles/world-folio.css"></head>
<body><main id="game-stage"><header><div class="brand"><b class="mark">◆</b><span>格拉拉的探求手记</span></div><span id="hud-rift-clock" class="rift-clock" role="timer" hidden></span><span class="en">提塔尔耶拉</span></header>
<section id="lobby" aria-label="远征大厅"></section>
<section id="battle" hidden>
<div class="title"><div><small>神代遗迹</small><h1 id="stage-name"></h1></div><div class="top-actions"><button id="pause">暂停</button><button id="reset"><kbd>R</kbd> 重试</button><button id="sound">音效：关</button><button id="camera-shake" type="button">震动：开</button><button id="leave">撤离结算</button></div></div>
<div class="battle-objective" id="adventure-status" hidden></div><div class="battle-objective" id="guardian-state" hidden></div>
<div id="trial-coach" hidden><strong id="trial-task"></strong><span id="trial-instructions"></span><label id="trial-foe-label">对练目标　<select id="trial-foe" aria-label="对练目标"></select></label><label id="trial-selector" hidden>试用主位　<select id="trial-titan" aria-label="试用主位虚数体"></select></label><div class="top-actions"><button data-trial-boot="trialBoot1"></button><button data-trial-boot="trialBoot2"></button></div></div>
<div id="machine-drop" class="battle-objective" role="status" hidden></div><section class="room"><div class="hud"><span id="hp" hidden></span><span id="perf"></span><div class="count">击杀 <b id="kills"></b></div></div><div class="arena"><canvas id="scene" width="576" height="196" tabindex="0" aria-label="横版遗迹探索：方向键移动，空格跳跃"></canvas><div id="pause-layer" hidden><strong>战斗已暂停</strong><button id="resume">继续战斗</button></div></div>
<div class="bar"><span class="live"></span><span id="report" aria-live="polite"></span></div><div class="loot-line"><span id="loot-ticker"></span><button id="finish" hidden>查看战利品</button></div></section>
<div class="controls"><span><kbd>A</kbd><kbd>D</kbd> / 方向键移动</span><span><kbd>空格</kbd> 跳跃<span id="wind-control" hidden>；再次按下可空中跳，按住命中可借力</span></span><span id="trial-shortcuts"><kbd>1</kbd><kbd>2</kbd> 试用风／地主位并重开</span></div>
<div class="touch"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="jump">跳跃</button></div></section>
<aside id="game-dock" aria-label="状态与功能菜单" hidden></aside>
<dialog id="game-panel" aria-label="功能菜单"><span id="panel-rift-clock" class="rift-clock" role="timer" hidden></span><button id="close-panel" aria-label="关闭菜单">×</button><div id="panel-body"></div></dialog></main>
