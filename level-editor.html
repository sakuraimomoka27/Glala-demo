<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>关卡编辑器 · 格拉拉的探求手记</title>
<link rel="stylesheet" href="frontend/styles/level-editor.css"></head>
<body><header><div class="brand"><span class="sigil" aria-hidden="true">◈</span><div><small>格拉拉的探求手记</small><h1>关卡编辑器</h1></div></div>
<nav><a href="./">返回游戏</a><a href="effects.html" target="_blank" rel="noopener">战斗特效库</a><button id="new">新建</button><button id="open">打开地图</button><button id="write" title="写入项目正式 1-2 时，选择 dist/content/maps/ember_pass.json">保存文件</button><button id="export">导出 JSON</button><button id="play" class="primary">▶　试走关卡</button></nav></header>
<main><aside class="library"><h2>元件库</h2><p class="tip">拖入画布，或先选元件再点放。</p><div id="palette"></div><div class="group" id="custom-library"></div><details class="assets"><summary>导入 PNG 素材</summary><label>用途<select id="asset-role"><option value="platform">单向平台</option><option value="solid">实体地形</option><option value="prop">装饰</option><option value="background">循环底图</option></select></label><label>元件原宽 / 米<input id="asset-width" type="number" value="3" min=".5" max="24" step=".25"></label><button id="add-image">选择 PNG</button><input hidden type="file" id="image-file" accept=".png,image/png"></details></aside>
<section class="work"><div class="workhead"><div><small>场景画布</small><h2 id="map-title">灰烬栈道</h2></div><div class="tools"><button id="undo" title="撤销 Ctrl+Z">撤销</button><button id="redo" title="重做 Ctrl+Shift+Z">重做</button><label><input type="checkbox" id="grid" checked>网格</label><label><input type="checkbox" id="snap" checked>吸附</label></div></div>
<div class="viewport"><canvas id="map" tabindex="0" aria-label="横版地图，拖动元件调整位置"></canvas></div>
<div class="viewtools"><span id="coordinates">0.0 m</span><label>视野 <select id="zoom"><option value="18">18 米</option><option value="26" selected>26 米</option><option value="42">42 米</option><option value="64">64 米</option></select></label><button id="loop-play">▶ 巡游试走</button></div>
<div class="overview"><div><strong>全图导航</strong><small id="length-label"></small></div><canvas id="overview" tabindex="0" aria-label="全图导航，点击或拖动切换区段"></canvas></div>
<div class="foot"><span id="status" role="status"></span><span>空格拖动平移 · Delete 删除</span></div></section>
<aside class="inspector"><h2>地图设置</h2><label>地图名称<input id="name" maxlength="60"></label><label>背景图<select id="background"></select></label>
<div class="pair"><label>长度 / 米<input id="width" type="number" min="20" max="1200" step="1"></label><label>循环接点 / 米<input id="loop-end" type="number" min="0" max="1200" step=".25" title="从此处接回起点，0 表示单程"></label></div>
<div class="object"><small>所选元件</small><h2 id="selection">未选择</h2><div id="properties"></div></div>
<div class="publish"><label>章节关卡<select id="chapter-slot"></select></label><button id="apply">应用到本机章节</button><div class="bind-actions"><button id="load-binding">载入关卡</button><button id="unbind">恢复原版</button></div><span>草稿自动保存在此浏览器。</span></div></aside></main>
<input hidden type="file" id="file" accept=".json,application/json">
<script src="content/catalog.js"></script><script src="shared/level-map.js"></script><script src="frontend/art/glala.js"></script><script src="shared/projectile-effects.js"></script>
<script src="shared/field-combat.js"></script>
<script src="shared/skills/strikes.js"></script>
<script src="shared/skills/shadows.js"></script>
<script src="shared/skills/ordnance.js"></script>
<script src="shared/skills/patterns.js"></script>
<script src="shared/skills/echo-modifiers.js"></script><script src="shared/skills/echo-sets.js"></script><script src="shared/skills/main-abilities.js"></script><script src="shared/skills/library.js"></script>
<script src="frontend/art/field-enemies.js"></script><script src="frontend/art/level-paint.js"></script><script src="frontend/ui/level-editor.js"></script></body></html>
